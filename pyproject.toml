[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-maildir"
version = "0.1.0"
description = "A durable, local mailbox for agents running in different harnesses."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "agent-maildir contributors" }]
keywords = ["agents", "maildir", "messaging", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/shafty023/agent-maildir"
Issues = "https://github.com/shafty023/agent-maildir/issues"

[project.scripts]
agent-maildir = "agent_maildir.agent_mail:main"
agent-maildir-mcp = "agent_maildir.mailbox_channel:main"
agent-maildir-hook = "agent_maildir.mailbox_hook:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_maildir = [
  "skills/agent-maildir/SKILL.md",
  "skills/agent-maildir/agents/openai.yaml",
  "skills/agent-maildir/references/protocol.md",
]

