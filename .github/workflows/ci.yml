name: test

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -v
      - name: Run tests without host CLIs
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        shell: bash
        run: |
          python_bin="$(command -v python)"
          clean_home="$(mktemp -d)"
          clean_root="$(mktemp -d)"
          env -i \
            PATH=/usr/bin:/bin \
            HOME="$clean_home" \
            AGENT_MAILDIR_ROOT="$clean_root/root" \
            PYTHONDONTWRITEBYTECODE=1 \
            "$python_bin" -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Install wheel in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/agent-maildir-install"
          "$RUNNER_TEMP/agent-maildir-install/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/agent-maildir-install/bin/agent-maildir" --help
          "$RUNNER_TEMP/agent-maildir-install/bin/agent-maildir-mcp" --help
          "$RUNNER_TEMP/agent-maildir-install/bin/agent-maildir-hook" --help
